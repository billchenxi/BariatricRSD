<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 800; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 400; fill: #4b5563; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 800; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; fill: #4b5563; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 400; fill: #4b5563; }
      .white { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .boxText { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 800; fill: #111827; }
      .boxTextSmall { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .greenText { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; fill: #059669; }
      .redText { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; fill: #dc2626; }
      .amberText { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #d97706; }
      .blueBox { fill: #dbeafe; stroke: #2563eb; stroke-width: 3.5; }
      .grayBox { fill: #f9fafb; stroke: #1f2937; stroke-width: 3.5; }
      .purpleBox { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3.5; }
      .greenBox { fill: #d1fae5; stroke: #059669; stroke-width: 3.5; }
      .amberBox { fill: #fef3c7; stroke: #f59e0b; stroke-width: 3.5; }
      .arrow { stroke: #1f2937; stroke-width: 3.4; fill: none; marker-end: url(#arrowDark); }
      .greenArrow { stroke: #059669; stroke-width: 3.4; fill: none; marker-end: url(#arrowGreen); }
      .amberArrow { stroke: #f59e0b; stroke-width: 3.4; fill: none; marker-end: url(#arrowAmber); }
      .redDash { stroke: #dc2626; stroke-width: 3.4; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrowDark" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#dc2626"/>
    </marker>
    <clipPath id="frameClip0"><rect x="58" y="112" width="230" height="132"/></clipPath>
    <clipPath id="frameClip1"><rect x="308" y="112" width="230" height="132"/></clipPath>
    <clipPath id="frameClip2"><rect x="558" y="112" width="230" height="132"/></clipPath>
    <clipPath id="frameClip3"><rect x="808" y="112" width="230" height="132"/></clipPath>
    <clipPath id="frameClip4"><rect x="1058" y="112" width="230" height="132"/></clipPath>
  </defs>

  <rect width="1400" height="720" fill="#ffffff"/>

  <text x="58" y="48" class="title">First pass: phase prediction is visual-only</text>
  <text x="58" y="78" class="subtitle">Prefix frames go through ViT-B/16 and HTA with a placeholder workflow slot; the phase head ignores that slot at this point.</text>

  <text x="58" y="103" class="section">Observed prefix x<tspan baseline-shift="sub" font-size="14">1:t</tspan></text>

  <image x="58" y="112" width="230" height="132" href="assets/BBP12_00003439.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#frameClip0)"/>
  <rect x="58" y="112" width="230" height="132" fill="none" stroke="#2563eb" stroke-width="4"/>
  <rect x="58" y="112" width="82" height="31" fill="#000000" opacity="0.56"/>
  <text x="70" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-20</tspan></text>

  <image x="308" y="112" width="230" height="132" href="assets/BBP12_00003444.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#frameClip1)"/>
  <rect x="308" y="112" width="230" height="132" fill="none" stroke="#2563eb" stroke-width="4"/>
  <rect x="308" y="112" width="82" height="31" fill="#000000" opacity="0.56"/>
  <text x="320" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-15</tspan></text>

  <image x="558" y="112" width="230" height="132" href="assets/BBP12_00003449.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#frameClip2)"/>
  <rect x="558" y="112" width="230" height="132" fill="none" stroke="#2563eb" stroke-width="4"/>
  <rect x="558" y="112" width="82" height="31" fill="#000000" opacity="0.56"/>
  <text x="570" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-10</tspan></text>

  <image x="808" y="112" width="230" height="132" href="assets/BBP12_00003454.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#frameClip3)"/>
  <rect x="808" y="112" width="230" height="132" fill="none" stroke="#2563eb" stroke-width="4"/>
  <rect x="808" y="112" width="82" height="31" fill="#000000" opacity="0.56"/>
  <text x="820" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-5</tspan></text>

  <image x="1058" y="112" width="230" height="132" href="assets/BBP12_00003459.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#frameClip4)"/>
  <rect x="1058" y="112" width="230" height="132" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <rect x="1058" y="112" width="66" height="31" fill="#000000" opacity="0.56"/>
  <text x="1070" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t</tspan></text>

  <text x="58" y="294" class="section">Computation graph for step 1</text>
  <text x="58" y="318" class="small">The placeholder is a temporary input for the temporal stack, not a source of phase information.</text>

  <rect x="58" y="372" width="155" height="78" rx="13" class="blueBox"/>
  <text x="136" y="402" text-anchor="middle" class="boxText">prefix</text>
  <text x="136" y="426" text-anchor="middle" class="boxText">frames</text>

  <path d="M216 411 H270" class="arrow"/>

  <rect x="280" y="372" width="194" height="78" rx="13" class="blueBox"/>
  <text x="377" y="403" text-anchor="middle" class="boxTextSmall">visual encoder</text>
  <text x="377" y="427" text-anchor="middle" class="boxText">ViT-B/16</text>

  <path d="M478 411 H532" class="arrow"/>

  <rect x="542" y="372" width="166" height="78" rx="13" class="grayBox"/>
  <text x="625" y="402" text-anchor="middle" class="boxText">frame</text>
  <text x="625" y="426" text-anchor="middle" class="boxText">features</text>

  <path d="M712 411 H766" class="arrow"/>

  <rect x="776" y="372" width="160" height="78" rx="13" class="purpleBox"/>
  <text x="856" y="402" text-anchor="middle" class="boxText">HTA</text>
  <text x="856" y="426" text-anchor="middle" class="boxText">blocks</text>

  <path d="M938 411 H992" class="greenArrow"/>

  <rect x="1002" y="372" width="160" height="78" rx="13" class="greenBox"/>
  <text x="1082" y="402" text-anchor="middle" class="boxText">phase</text>
  <text x="1082" y="426" text-anchor="middle" class="boxText">head</text>

  <path d="M1164 411 H1218" class="greenArrow"/>

  <rect x="1228" y="372" width="118" height="78" rx="13" class="greenBox"/>
  <text x="1287" y="402" text-anchor="middle" class="boxText">phase</text>
  <text x="1287" y="426" text-anchor="middle" class="boxText">logits</text>

  <path d="M624 366 C724 302, 932 302, 1078 366" class="greenArrow"/>
  <text x="842" y="324" text-anchor="middle" class="greenText">phase head reads visual features only</text>
  <text x="1082" y="478" text-anchor="middle" class="small">p(phi | x<tspan baseline-shift="sub" font-size="10">1:t</tspan>)</text>

  <line x1="1236" y1="528" x2="1328" y2="528" stroke="#4b5563" stroke-width="2"/>
  <rect x="1241" y="515" width="15" height="13" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <rect x="1264" y="501" width="15" height="27" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <rect x="1287" y="482" width="15" height="46" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <rect x="1310" y="456" width="15" height="72" fill="#059669" stroke="#059669" stroke-width="2"/>
  <text x="1282" y="554" text-anchor="middle" class="tiny">phase distribution</text>

  <rect x="494" y="572" width="178" height="70" rx="13" class="amberBox"/>
  <text x="583" y="600" text-anchor="middle" class="boxTextSmall">placeholder</text>
  <text x="583" y="624" text-anchor="middle" class="boxTextSmall">cluster id</text>

  <path d="M674 607 H724" class="amberArrow"/>

  <rect x="734" y="572" width="198" height="70" rx="13" class="amberBox"/>
  <text x="833" y="600" text-anchor="middle" class="boxTextSmall">workflow token</text>
  <text x="833" y="624" text-anchor="middle" class="boxTextSmall">E[z_dummy]</text>

  <path d="M833 572 C842 535, 852 494, 856 450" class="amberArrow"/>
  <text x="898" y="546" class="amberText">prepended into HTA input</text>

  <path d="M833 572 C946 510, 1014 476, 1074 450" class="redDash"/>
  <path d="M1056 522 L1094 560 M1094 522 L1056 560" stroke="#dc2626" stroke-width="7" fill="none"/>
  <text x="1090" y="592" text-anchor="middle" class="redText">no influence on</text>
  <text x="1090" y="614" text-anchor="middle" class="redText">phase head</text>

  <rect x="58" y="572" width="248" height="70" rx="13" class="grayBox"/>
  <text x="182" y="600" text-anchor="middle" class="boxTextSmall">dummy workflow slot</text>
  <text x="182" y="624" text-anchor="middle" class="boxTextSmall">for first pass</text>

  <text x="58" y="684" class="small">Key: phase logits are a function of the visual prefix, so the next step can infer a workflow posterior without reading ground-truth phase labels.</text>
</svg>
