<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><style>.section,.small,.subtitle,.tiny,.title{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:800;fill:#111827}.subtitle{font-size:18px;font-weight:400;fill:#4b5563}.section{font-size:21px;font-weight:800;fill:#111827}.small,.tiny{font-size:14px;font-weight:400;fill:#4b5563}.tiny{font-size:12px}.amberText{font-family:Arial,Helvetica,sans-serif}.boxText{font-weight:800}.boxText,.boxTextSmall,.greenText,.redText,.white{font-family:Arial,Helvetica,sans-serif}.white{font-size:20px;font-weight:800;fill:#fff}.boxText{font-size:19px;fill:#111827}.boxTextSmall{fill:#111827;font-size:15px;font-weight:700}.greenText,.redText{font-size:15px;font-weight:800;fill:#059669}.redText{fill:#dc2626}.amberText{font-size:14px;font-weight:700;fill:#d97706}.blueBox,.grayBox{fill:#dbeafe;stroke:#2563eb;stroke-width:3.5}.grayBox{fill:#f9fafb;stroke:#1f2937}.purpleBox{fill:#ede9fe;stroke:#7c3aed}.amberBox,.greenBox,.purpleBox{stroke-width:3.5}.greenBox{fill:#d1fae5;stroke:#059669}.amberBox{fill:#fef3c7;stroke:#f59e0b}.arrow{stroke:#1f2937;marker-end:url(#arrowDark)}.amberArrow,.arrow{stroke-width:3.4;fill:none}.greenArrow{stroke:#059669;marker-end:url(#arrowGreen)}.greenArrow,.redDash{stroke-width:3.4;fill:none}.amberArrow{stroke:#f59e0b;marker-end:url(#arrowAmber)}.redDash{stroke:#dc2626;stroke-dasharray:9 7;marker-end:url(#arrowRed)}</style><marker id="arrowDark" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5.5"><path fill="#1f2937" d="M0,0 L11,5.5 L0,11 Z"/></marker><marker id="arrowGreen" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5.5"><path fill="#059669" d="M0,0 L11,5.5 L0,11 Z"/></marker><marker id="arrowAmber" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5.5"><path fill="#f59e0b" d="M0,0 L11,5.5 L0,11 Z"/></marker><marker id="arrowRed" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5.5"><path fill="#dc2626" d="M0,0 L11,5.5 L0,11 Z"/></marker><clipPath id="frameClip0"><rect width="230" height="132" x="58" y="112"/></clipPath><clipPath id="frameClip1"><rect width="230" height="132" x="308" y="112"/></clipPath><clipPath id="frameClip2"><rect width="230" height="132" x="558" y="112"/></clipPath><clipPath id="frameClip3"><rect width="230" height="132" x="808" y="112"/></clipPath><clipPath id="frameClip4"><rect width="230" height="132" x="1058" y="112"/></clipPath></defs><rect width="1400" height="720" fill="#fff"/><text x="58" y="48" class="title">First pass: phase prediction is visual-only</text><text x="58" y="78" class="subtitle">Prefix frames go through ViT-B/16 and HTA with a placeholder workflow slot; the phase head ignores that slot at this point.</text><text x="58" y="103" class="section">Observed prefix x<tspan baseline-shift="sub" font-size="14">1:t</tspan></text><image width="230" height="132" x="58" y="112" clip-path="url(#frameClip0)" href="assets/BBP12_00003439.jpg" preserveAspectRatio="xMidYMid slice"/><rect width="230" height="132" x="58" y="112" fill="none" stroke="#2563eb" stroke-width="4"/><rect width="82" height="31" x="58" y="112" fill="#000" opacity=".56"/><text x="70" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-20</tspan></text><image width="230" height="132" x="308" y="112" clip-path="url(#frameClip1)" href="assets/BBP12_00003444.jpg" preserveAspectRatio="xMidYMid slice"/><rect width="230" height="132" x="308" y="112" fill="none" stroke="#2563eb" stroke-width="4"/><rect width="82" height="31" x="308" y="112" fill="#000" opacity=".56"/><text x="320" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-15</tspan></text><image width="230" height="132" x="558" y="112" clip-path="url(#frameClip2)" href="assets/BBP12_00003449.jpg" preserveAspectRatio="xMidYMid slice"/><rect width="230" height="132" x="558" y="112" fill="none" stroke="#2563eb" stroke-width="4"/><rect width="82" height="31" x="558" y="112" fill="#000" opacity=".56"/><text x="570" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-10</tspan></text><image width="230" height="132" x="808" y="112" clip-path="url(#frameClip3)" href="assets/BBP12_00003454.jpg" preserveAspectRatio="xMidYMid slice"/><rect width="230" height="132" x="808" y="112" fill="none" stroke="#2563eb" stroke-width="4"/><rect width="82" height="31" x="808" y="112" fill="#000" opacity=".56"/><text x="820" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t-5</tspan></text><image width="230" height="132" x="1058" y="112" clip-path="url(#frameClip4)" href="assets/BBP12_00003459.jpg" preserveAspectRatio="xMidYMid slice"/><rect width="230" height="132" x="1058" y="112" fill="none" stroke="#f59e0b" stroke-width="5"/><rect width="66" height="31" x="1058" y="112" fill="#000" opacity=".56"/><text x="1070" y="135" class="white">x<tspan baseline-shift="sub" font-size="14">t</tspan></text><text x="58" y="294" class="section">Computation graph for step 1</text><text x="58" y="318" class="small">The placeholder is a temporary input for the temporal stack, not a source of phase information.</text><rect width="155" height="78" x="58" y="372" class="blueBox" rx="13"/><text x="136" y="402" class="boxText" text-anchor="middle">prefix</text><text x="136" y="426" class="boxText" text-anchor="middle">frames</text><path d="M216 411 H270" class="arrow"/><rect width="194" height="78" x="280" y="372" class="blueBox" rx="13"/><text x="377" y="403" class="boxTextSmall" text-anchor="middle">visual encoder</text><text x="377" y="427" class="boxText" text-anchor="middle">ViT-B/16</text><path d="M478 411 H532" class="arrow"/><rect width="166" height="78" x="542" y="372" class="grayBox" rx="13"/><text x="625" y="402" class="boxText" text-anchor="middle">frame</text><text x="625" y="426" class="boxText" text-anchor="middle">features</text><path d="M712 411 H766" class="arrow"/><rect width="160" height="78" x="776" y="372" class="purpleBox" rx="13"/><text x="856" y="402" class="boxText" text-anchor="middle">HTA</text><text x="856" y="426" class="boxText" text-anchor="middle">blocks</text><path d="M938 411 H992" class="greenArrow"/><rect width="160" height="78" x="1002" y="372" class="greenBox" rx="13"/><text x="1082" y="402" class="boxText" text-anchor="middle">phase</text><text x="1082" y="426" class="boxText" text-anchor="middle">head</text><path d="M1164 411 H1218" class="greenArrow"/><rect width="118" height="78" x="1228" y="372" class="greenBox" rx="13"/><text x="1287" y="402" class="boxText" text-anchor="middle">phase</text><text x="1287" y="426" class="boxText" text-anchor="middle">logits</text><path d="M624 366 C724 302, 932 302, 1078 366" class="greenArrow"/><text x="842" y="324" class="greenText" text-anchor="middle">phase head reads visual features only</text><text x="1082" y="478" class="small" text-anchor="middle">p(phi | x<tspan baseline-shift="sub" font-size="10">1:t</tspan>)</text><line x1="1236" x2="1328" y1="528" y2="528" stroke="#4b5563" stroke-width="2"/><rect width="15" height="13" x="1241" y="515" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect width="15" height="27" x="1264" y="501" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect width="15" height="46" x="1287" y="482" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect width="15" height="72" x="1310" y="456" fill="#059669" stroke="#059669" stroke-width="2"/><text x="1282" y="554" class="tiny" text-anchor="middle">phase distribution</text><rect width="178" height="70" x="494" y="572" class="amberBox" rx="13"/><text x="583" y="600" class="boxTextSmall" text-anchor="middle">placeholder</text><text x="583" y="624" class="boxTextSmall" text-anchor="middle">cluster id</text><path d="M674 607 H724" class="amberArrow"/><rect width="198" height="70" x="734" y="572" class="amberBox" rx="13"/><text x="833" y="600" class="boxTextSmall" text-anchor="middle">workflow token</text><text x="833" y="624" class="boxTextSmall" text-anchor="middle">E[z_dummy]</text><path d="M833 572 C842 535, 852 494, 856 450" class="amberArrow"/><text x="898" y="546" class="amberText">prepended into HTA input</text><path d="M833 572 C946 510, 1014 476, 1074 450" class="redDash"/><path fill="none" stroke="#dc2626" stroke-width="7" d="M1056 522 L1094 560 M1094 522 L1056 560"/><text x="1090" y="592" class="redText" text-anchor="middle">no influence on</text><text x="1090" y="614" class="redText" text-anchor="middle">phase head</text><rect width="248" height="70" x="58" y="572" class="grayBox" rx="13"/><text x="182" y="600" class="boxTextSmall" text-anchor="middle">dummy workflow slot</text><text x="182" y="624" class="boxTextSmall" text-anchor="middle">for first pass</text><text x="58" y="684" class="small">Key: phase logits are a function of the visual prefix, so the next step can infer a workflow posterior without reading ground-truth phase labels.</text></svg>