<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><style>.body,.label,.small,.subtitle,.title{font-family:Avenir Next,Arial,sans-serif}.title{font-size:46px;font-weight:800;fill:#111827}.subtitle{font-size:24px;font-weight:500;fill:#4b5563}.label{font-size:22px;font-weight:700;fill:#111827}.body,.small{font-size:19px;font-weight:500;fill:#374151}.small{font-size:16px;fill:#4b5563}</style><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter></defs><rect width="1600" height="950" fill="#f8fafc"/><text x="70" y="78" class="title">Concept 8: shuffled-token control</text><text x="72" y="120" class="subtitle">If any extra learned vector helped, a shuffled workflow token would improve too. It does not.</text><rect width="390" height="510" x="110" y="205" fill="#fff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" rx="34"/><rect width="390" height="510" x="605" y="205" fill="#fff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" rx="34"/><rect width="390" height="510" x="1100" y="205" fill="#fff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" rx="34"/><text x="305" y="268" class="label" text-anchor="middle">No token</text><text x="800" y="268" class="label" text-anchor="middle">Shuffled token</text><text x="1295" y="268" class="label" text-anchor="middle">Real workflow token</text><circle cx="305" cy="378" r="68" fill="#e5e7eb" stroke="#64748b" stroke-width="4"/><text x="305" y="386" class="label" text-anchor="middle">none</text><path stroke="#dc2626" stroke-linecap="round" stroke-width="12" d="M735 344 L865 412 M865 344 L735 412"/><rect width="160" height="112" x="720" y="322" fill="none" stroke="#64748b" stroke-width="4" rx="28"/><circle cx="1295" cy="378" r="68" fill="#ccfbf1" stroke="#0f766e" stroke-width="5"/><text x="1295" y="370" class="label" text-anchor="middle">route</text><text x="1295" y="398" class="label" text-anchor="middle">ID</text><line x1="190" x2="1410" y1="620" y2="620" stroke="#cbd5e1" stroke-width="3"/><rect width="150" height="169" x="230" y="451" fill="#94a3b8"/><text x="305" y="646" class="body" text-anchor="middle">13.03</text><rect width="150" height="182" x="725" y="438" fill="#f97316"/><text x="800" y="646" class="body" text-anchor="middle">13.14</text><rect width="150" height="80" x="1220" y="540" fill="#0f766e"/><text x="1295" y="646" class="body" text-anchor="middle">12.18</text><text x="305" y="690" class="small" text-anchor="middle">baseline MAE</text><text x="800" y="690" class="small" text-anchor="middle">no semantic gain</text><text x="1295" y="690" class="small" text-anchor="middle">workflow meaning helps</text><rect width="880" height="78" x="360" y="792" fill="#ecfdf5" stroke="#0f766e" stroke-width="3" rx="26"/><text x="800" y="826" class="label" text-anchor="middle">Conclusion: the improvement is not just extra parameter capacity.</text><text x="800" y="856" class="small" text-anchor="middle">It requires the token to preserve the real video-to-workflow assignment.</text></svg>