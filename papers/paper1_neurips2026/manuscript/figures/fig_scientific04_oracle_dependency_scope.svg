<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><style>.label,.section,.small,.subtitle,.title{font-family:Avenir Next,Arial,sans-serif}.title{font-size:38px;font-weight:800;fill:#111827}.subtitle{font-size:21px;font-weight:500;fill:#4b5563}.label,.section{fill:#111827}.section{font-size:24px;font-weight:800}.label{font-size:18px;font-weight:700}.mono,.small{font-weight:600}.small{font-size:14px;fill:#475569}.mono{font-family:Menlo,Consolas,monospace;font-size:15px;fill:#111827}.card{fill:#fff;stroke:#d8dee8;stroke-width:2}.orange{fill:#fff7ed;stroke:#ea580c}.orange,.purple,.red,.teal{stroke-width:2.5}.teal{fill:#ecfdf5;stroke:#0f766e}.purple{fill:#f5f3ff;stroke:#7c3aed}.red{fill:#fef2f2;stroke:#dc2626}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}</style><filter id="shadow" width="130%" height="150%" x="-15%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#334155" d="M0,0 L14,7 L0,14 Z"/></marker><marker id="arrowBlue" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#2563eb" d="M0,0 L14,7 L0,14 Z"/></marker><marker id="arrowTeal" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#0f766e" d="M0,0 L14,7 L0,14 Z"/></marker></defs><rect width="1600" height="950" fill="#f8fafc"/><text x="70" y="72" class="title">Concept 4: which oracle dependency is closed?</text><text x="70" y="108" class="subtitle">The paper closes the inference-time cluster oracle. Training still uses privileged phase supervision for the prefix-derived cluster ID.</text><rect width="450" height="600" x="75" y="170" class="card" filter="url(#shadow)" rx="28"/><text x="300" y="225" class="section" text-anchor="middle">Retrospective oracle</text><rect width="350" height="72" x="125" y="270" class="red" rx="18"/><text x="300" y="300" class="label" text-anchor="middle">source of z</text><text x="300" y="326" class="small" text-anchor="middle">full-video GT phase sequence</text><path stroke="#334155" stroke-width="4" marker-end="url(#arrow)" d="M300 355 L300 420"/><rect width="350" height="78" x="125" y="435" class="orange" rx="18"/><text x="300" y="466" class="mono" text-anchor="middle">z = argmax centroid</text><text x="300" y="493" class="small" text-anchor="middle">hard cluster ID</text><rect width="350" height="82" x="125" y="580" class="gray" rx="18"/><text x="300" y="613" class="label" text-anchor="middle">scope</text><text x="300" y="641" class="small" text-anchor="middle">diagnostic upper bound; not deployable</text><rect width="450" height="600" x="575" y="170" class="card" filter="url(#shadow)" rx="28"/><text x="800" y="225" class="section" text-anchor="middle">Causal variant: training</text><rect width="350" height="72" x="625" y="270" class="red" rx="18"/><text x="800" y="300" class="label" text-anchor="middle">teacher-forced source</text><text x="800" y="326" class="small" text-anchor="middle">GT phase prefix [0, t_mid]</text><path stroke="#334155" stroke-width="4" marker-end="url(#arrow)" d="M800 355 L800 420"/><rect width="350" height="78" x="625" y="435" class="orange" rx="18"/><text x="800" y="466" class="mono" text-anchor="middle">hard prefix-derived z</text><text x="800" y="493" class="small" text-anchor="middle">fallback if &lt;2 unique phases (~7%)</text><rect width="350" height="82" x="625" y="580" class="gray" rx="18"/><text x="800" y="613" class="label" text-anchor="middle">scope</text><text x="800" y="641" class="small" text-anchor="middle">privileged training signal remains</text><rect width="450" height="600" x="1075" y="170" class="card" filter="url(#shadow)" rx="28"/><text x="1300" y="225" class="section" text-anchor="middle">Causal variant: inference</text><rect width="350" height="72" x="1125" y="270" class="teal" rx="18"/><text x="1300" y="300" class="label" text-anchor="middle">source of q</text><text x="1300" y="326" class="small" text-anchor="middle">model-predicted phase prefix from pixels</text><path stroke="#334155" stroke-width="4" marker-end="url(#arrow)" d="M1300 355 L1300 420"/><rect width="350" height="78" x="1125" y="435" class="purple" rx="18"/><text x="1300" y="466" class="mono" text-anchor="middle">q_k = softmax(-d_k / tau)</text><text x="1300" y="493" class="small" text-anchor="middle">soft cluster posterior</text><rect width="350" height="82" x="1125" y="580" class="teal" rx="18"/><text x="1300" y="613" class="label" text-anchor="middle">scope</text><text x="1300" y="641" class="small" text-anchor="middle">no GT phase labels; no full-case z</text><rect width="1020" height="58" x="290" y="815" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="18"/><text x="800" y="851" class="label" text-anchor="middle">Correct wording: causal-at-inference, not fully causal training.</text></svg>