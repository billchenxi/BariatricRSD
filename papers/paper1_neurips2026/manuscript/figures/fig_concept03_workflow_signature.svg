<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><style>.body,.cap,.label,.small,.subtitle,.title{font-family:Avenir Next,Arial,sans-serif}.title{font-size:46px;font-weight:800;fill:#111827}.subtitle{font-size:24px;font-weight:500;fill:#4b5563}.label{font-size:22px;font-weight:700;fill:#111827}.body,.small{font-size:19px;font-weight:500;fill:#374151}.small{font-size:16px;fill:#4b5563}.cap{font-size:18px;font-weight:700;fill:#111827}</style><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter><marker id="arrow" markerHeight="16" markerWidth="16" orient="auto" refX="14" refY="8"><path fill="#334155" d="M0,0 L16,8 L0,16 Z"/></marker></defs><rect width="1600" height="950" fill="#f8fafc"/><text x="70" y="78" class="title">Concept 3: turn a phase story into a workflow family</text><text x="72" y="120" class="subtitle">The cluster is not a duration bin; it is a summary of phase-order transitions.</text><rect width="1456" height="630" x="72" y="178" fill="#fff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" rx="34"/><path fill="none" stroke="#cbd5e1" stroke-linecap="round" stroke-width="9" d="M155 310 C250 240, 345 378, 440 306 S640 288, 715 348"/><g><circle cx="160" cy="310" r="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="160" y="317" class="cap" text-anchor="middle">A</text><circle cx="255" cy="265" r="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="255" y="272" class="cap" text-anchor="middle">A</text><circle cx="350" cy="350" r="34" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="350" y="357" class="cap" text-anchor="middle">B</text><circle cx="450" cy="305" r="34" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="450" y="312" class="cap" text-anchor="middle">B</text><circle cx="555" cy="292" r="34" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><text x="555" y="299" class="cap" text-anchor="middle">C</text><circle cx="670" cy="338" r="34" fill="#e9d5ff" stroke="#7c3aed" stroke-width="3"/><text x="670" y="345" class="cap" text-anchor="middle">D</text></g><text x="405" y="430" class="label" text-anchor="middle">phase sequence</text><text x="405" y="460" class="small" text-anchor="middle">collapse repeats: A, A, B, B, C, D -&gt; A, B, C, D</text><path fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)" d="M755 330 C835 330, 865 330, 930 330"/><g><rect width="120" height="54" x="960" y="235" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="27"/><text x="1020" y="270" class="cap" text-anchor="middle">A-&gt;B</text><rect width="120" height="54" x="1095" y="305" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="27"/><text x="1155" y="340" class="cap" text-anchor="middle">B-&gt;C</text><rect width="120" height="54" x="1230" y="235" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="27"/><text x="1290" y="270" class="cap" text-anchor="middle">C-&gt;D</text><text x="1155" y="430" class="label" text-anchor="middle">transition bigrams</text><text x="1155" y="460" class="small" text-anchor="middle">TF-IDF weights transitions by how distinctive they are</text></g><path fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)" d="M330 555 C470 665, 560 515, 690 650"/><rect width="600" height="220" x="735" y="535" fill="#f8fafc" stroke="#d1d5db" stroke-width="2" rx="30"/><text x="1035" y="575" class="label" text-anchor="middle">PCA map + k-means islands</text><ellipse cx="880" cy="665" fill="#bfdbfe" opacity=".7" rx="95" ry="45"/><ellipse cx="1040" cy="660" fill="#ccfbf1" opacity=".72" rx="115" ry="50"/><ellipse cx="1210" cy="666" fill="#fed7aa" opacity=".75" rx="85" ry="42"/><g fill="#111827" opacity=".72"><circle cx="840" cy="650" r="7"/><circle cx="890" cy="670" r="7"/><circle cx="920" cy="645" r="7"/><circle cx="1005" cy="665" r="7"/><circle cx="1068" cy="641" r="7"/><circle cx="1098" cy="685" r="7"/><circle cx="1190" cy="650" r="7"/><circle cx="1234" cy="675" r="7"/></g><text x="1035" y="725" class="small" text-anchor="middle">Each island becomes one learned workflow token row E[k,:]</text><rect width="475" height="112" x="150" y="645" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="24"/><text x="178" y="684" class="label">What the token means</text><text x="178" y="716" class="body">A procedural pattern, not the raw phase labels and not the final duration.</text></svg>