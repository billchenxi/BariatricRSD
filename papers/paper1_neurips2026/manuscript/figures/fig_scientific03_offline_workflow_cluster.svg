<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><style>.body,.label,.section,.small,.subtitle,.title{font-family:Avenir Next,Arial,sans-serif}.title{font-size:38px;font-weight:800;fill:#111827}.subtitle{font-size:21px;font-weight:500;fill:#4b5563}.label,.section{fill:#111827}.section{font-size:24px;font-weight:800}.label{font-size:18px;font-weight:700}.body{font-size:17px;font-weight:500;fill:#374151}.small{font-size:14px;font-weight:600;fill:#475569}.mono,.monoSmall{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#111827}.monoSmall{font-size:12px;fill:#334155}.card{fill:#fff;stroke:#d8dee8;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.orange{fill:#fff7ed;stroke:#ea580c}.orange,.purple,.teal{stroke-width:2.5}.teal{fill:#ecfdf5;stroke:#0f766e}.purple{fill:#f5f3ff;stroke:#7c3aed}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}</style><filter id="shadow" width="130%" height="150%" x="-15%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#334155" d="M0,0 L14,7 L0,14 Z"/></marker><marker id="arrowBlue" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#2563eb" d="M0,0 L14,7 L0,14 Z"/></marker><marker id="arrowTeal" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#0f766e" d="M0,0 L14,7 L0,14 Z"/></marker></defs><rect width="1600" height="950" fill="#f8fafc"/><text x="70" y="72" class="title">Concept 3: what the workflow cluster actually encodes</text><text x="70" y="108" class="subtitle">The token is a learned embedding for a phase-order cluster, not a duration bin and not the raw phase labels.</text><rect width="1460" height="675" x="70" y="155" class="card" filter="url(#shadow)" rx="28"/><text x="105" y="205" class="section">Offline fitting, using training-set phase annotations</text><text x="105" y="236" class="body">Example from MB140 BBP12: full compressed phase sequence, cluster z = 1.</text><rect width="310" height="250" x="105" y="290" class="blue" rx="20"/><text x="130" y="330" class="label">1. Full phase sequence</text><text x="130" y="370" class="monoSmall">Preparation</text><text x="130" y="398" class="monoSmall">Gastric pouch creation</text><text x="130" y="426" class="monoSmall">Omentum division</text><text x="130" y="454" class="monoSmall">Gastro-jejunal anastomosis</text><text x="130" y="482" class="monoSmall">Jejuno-jejunal anastomosis</text><text x="130" y="510" class="monoSmall">Jejunal div. -&gt; Leak -&gt; Cleaning</text><path stroke="#334155" stroke-width="4" marker-end="url(#arrow)" d="M435 415 L520 415"/><rect width="300" height="250" x="540" y="290" class="teal" rx="20"/><text x="565" y="330" class="label">2. Transition bigrams</text><text x="565" y="370" class="monoSmall">prep -&gt; pouch</text><text x="565" y="398" class="monoSmall">pouch -&gt; omentum</text><text x="565" y="426" class="monoSmall">omentum -&gt; GJ</text><text x="565" y="454" class="monoSmall">GJ -&gt; JJ</text><text x="565" y="482" class="monoSmall">JJ -&gt; jejunal division</text><text x="565" y="510" class="monoSmall">...</text><path stroke="#334155" stroke-width="4" marker-end="url(#arrow)" d="M860 415 L945 415"/><rect width="250" height="250" x="965" y="290" class="purple" rx="20"/><text x="990" y="330" class="label">3. Vector space</text><text x="990" y="370" class="monoSmall">TF-IDF over bigrams</text><text x="990" y="408" class="monoSmall">PCA: 16 components</text><text x="990" y="446" class="monoSmall">point u in PCA space</text><path stroke="#334155" stroke-width="4" marker-end="url(#arrow)" d="M1235 415 L1320 415"/><rect width="150" height="250" x="1340" y="290" class="orange" rx="20"/><text x="1415" y="330" class="label" text-anchor="middle">4. k-means</text><circle cx="1415" cy="405" r="44" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/><text x="1415" y="413" class="label" text-anchor="middle">z=1</text><text x="1415" y="480" class="small" text-anchor="middle">MB140 K=6</text><rect width="585" height="120" x="130" y="610" class="gray" rx="22"/><text x="160" y="650" class="label">Oracle workflow token</text><text x="160" y="686" class="mono">hard lookup: e_z = E[z,:]</text><text x="160" y="716" class="small">Uses the full-video cluster label; diagnostic upper bound, not live inference.</text><rect width="585" height="120" x="885" y="610" class="gray" rx="22"/><text x="915" y="650" class="label">Causal-at-inference token</text><text x="915" y="686" class="mono">soft mixture: e_z = sum_k q_k E[k,:]</text><text x="915" y="716" class="small">Uses the same fitted transform, but applied to predicted prefix phases.</text></svg>