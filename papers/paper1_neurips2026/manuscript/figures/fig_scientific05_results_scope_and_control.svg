<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><style>.title{font-size:38px;font-weight:800;fill:#111827}.body,.label,.section,.small,.title{font-family:Avenir Next,Arial,sans-serif}.subtitle{font-size:21px;font-weight:500;fill:#4b5563}.subtitle,.tiny{font-family:Avenir Next,Arial,sans-serif}.label,.section{fill:#111827}.section{font-size:24px;font-weight:800}.label{font-size:18px;font-weight:700}.body{font-size:17px;font-weight:500;fill:#374151}.small{font-size:14px;font-weight:600;fill:#475569}.tiny{font-size:12px;font-weight:700;fill:#64748b}.card{fill:#fff;stroke:#d8dee8;stroke-width:2}.teal{fill:#ecfdf5;stroke:#0f766e;stroke-width:2.5}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}</style><filter id="shadow" width="130%" height="150%" x="-15%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#334155" d="M0,0 L14,7 L0,14 Z"/></marker><marker id="arrowBlue" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#2563eb" d="M0,0 L14,7 L0,14 Z"/></marker><marker id="arrowTeal" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#0f766e" d="M0,0 L14,7 L0,14 Z"/></marker></defs><rect width="1600" height="950" fill="#f8fafc"/><text x="70" y="72" class="title">Concept 5: the claim is a pattern across regimes, not one number</text><text x="70" y="108" class="subtitle">Strict-protocol numbers support the deployment-relevant workflow-conditioning claim; controls test whether the token carries semantic information.</text><rect width="690" height="310" x="75" y="165" class="card" filter="url(#shadow)" rx="26"/><text x="110" y="215" class="section">MB140 within-center, strict prefix-only</text><text x="110" y="250" class="body">Fold 0, 3 seeds; decoupled-oracle is the headline strict result.</text><line x1="145" x2="690" y1="400" y2="400" stroke="#cbd5e1" stroke-width="3"/><rect width="110" height="115" x="210" y="285" fill="#94a3b8"/><text x="265" y="430" class="label" text-anchor="middle">13.03</text><text x="265" y="455" class="small" text-anchor="middle">no token</text><rect width="110" height="108" x="405" y="292" fill="#60a5fa"/><text x="460" y="430" class="label" text-anchor="middle">12.26</text><text x="460" y="455" class="small" text-anchor="middle">oracle</text><rect width="110" height="100" x="600" y="300" fill="#0f766e"/><text x="655" y="430" class="label" text-anchor="middle">12.18</text><text x="655" y="455" class="small" text-anchor="middle">decoupled</text><rect width="72" height="55" x="110" y="290" class="teal" rx="14"/><text x="146" y="314" class="label" text-anchor="middle">-0.85</text><text x="146" y="337" class="tiny" text-anchor="middle">min</text><rect width="690" height="310" x="835" y="165" class="card" filter="url(#shadow)" rx="26"/><text x="870" y="215" class="section">MB140 cross-center, strict prefix-only</text><text x="870" y="250" class="body">Train Bern, validate Strasbourg, 3 seeds.</text><line x1="905" x2="1450" y1="400" y2="400" stroke="#cbd5e1" stroke-width="3"/><rect width="110" height="115" x="970" y="285" fill="#94a3b8"/><text x="1025" y="430" class="label" text-anchor="middle">17.80</text><text x="1025" y="455" class="small" text-anchor="middle">no token</text><rect width="110" height="108" x="1165" y="292" fill="#60a5fa"/><text x="1220" y="430" class="label" text-anchor="middle">17.71</text><text x="1220" y="455" class="small" text-anchor="middle">oracle</text><rect width="110" height="85" x="1360" y="315" fill="#0f766e"/><text x="1415" y="430" class="label" text-anchor="middle">17.33</text><text x="1415" y="455" class="small" text-anchor="middle">decoupled</text><rect width="72" height="55" x="870" y="290" class="teal" rx="14"/><text x="906" y="314" class="label" text-anchor="middle">-0.47</text><text x="906" y="337" class="tiny" text-anchor="middle">min</text><rect width="690" height="270" x="75" y="535" class="card" filter="url(#shadow)" rx="26"/><text x="110" y="585" class="section">Cholec80 contrast case</text><text x="110" y="620" class="body">Strict single-seed range is 0.08 min: no meaningful workflow-conditioning effect.</text><rect width="160" height="70" x="130" y="665" class="gray" rx="18"/><text x="210" y="693" class="label" text-anchor="middle">4.34</text><text x="210" y="718" class="small" text-anchor="middle">no token</text><rect width="160" height="70" x="330" y="665" class="gray" rx="18"/><text x="410" y="693" class="label" text-anchor="middle">4.33</text><text x="410" y="718" class="small" text-anchor="middle">oracle</text><rect width="160" height="70" x="530" y="665" class="gray" rx="18"/><text x="610" y="693" class="label" text-anchor="middle">4.26</text><text x="610" y="718" class="small" text-anchor="middle">prefix</text><text x="110" y="770" class="small">Centered-window teacher-forced prefix was worse (5.03 vs 4.61).</text><text x="110" y="792" class="small">That negative effect does not reproduce under the strict protocol.</text><rect width="690" height="270" x="835" y="535" class="card" filter="url(#shadow)" rx="26"/><text x="870" y="585" class="section">Shuffled-token semantic control</text><text x="870" y="620" class="body">If any extra vector helped, shuffled tokens should help. They do not.</text><line x1="900" x2="1465" y1="735" y2="735" stroke="#cbd5e1" stroke-width="3"/><rect width="105" height="100" x="955" y="635" fill="#94a3b8"/><text x="1007" y="765" class="label" text-anchor="middle">13.03</text><text x="1007" y="790" class="small" text-anchor="middle">no token</text><rect width="105" height="110" x="1165" y="625" fill="#f97316"/><text x="1217" y="765" class="label" text-anchor="middle">13.14</text><text x="1217" y="790" class="small" text-anchor="middle">shuffled</text><rect width="105" height="55" x="1375" y="680" fill="#0f766e"/><text x="1427" y="765" class="label" text-anchor="middle">12.18</text><text x="1427" y="790" class="small" text-anchor="middle">real token</text></svg>